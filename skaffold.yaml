apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: tetsu-n--game
build:
  tagPolicy:
    envTemplate:
      template: "1"
  artifacts:
    - image: game
      docker:
        dockerfile: Dockerfile
    - image: game-api
      context: api-server
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - k8s/deployment.yaml
    - k8s/service.yaml
    - k8s/ingress.yaml
    - k8s/statefulSet.yaml